name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Extract app version metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: app_version
        run: |
          VERSION_CODE=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          VERSION_NAME=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK to backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_UPLOAD_URL: ${{ secrets.RELEASE_UPLOAD_URL }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
          VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
        run: |
          curl --fail --show-error --location \
            -X POST "$RELEASE_UPLOAD_URL" \
            -H "X-CI-Upload-Token: $RELEASE_UPLOAD_TOKEN" \
            -F "platform=android" \
            -F "channel=stable" \
            -F "version_code=$VERSION_CODE" \
            -F "version_name=$VERSION_NAME" \
            -F "changelog=Automated build from commit $GITHUB_SHA" \
            -F "apk=@app/build/outputs/apk/release/app-release.apk"

