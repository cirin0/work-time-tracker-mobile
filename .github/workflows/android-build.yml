name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Prepare release signing config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "Missing one or more Android signing secrets"
            exit 1
          fi

          RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"

          echo "RELEASE_STORE_FILE=$RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Prepare build version
        id: build_version
        run: |
          BASE_VERSION_NAME=$(grep -E '^appVersionName=' gradle.properties | head -1 | cut -d '=' -f2)
          if [ -z "$BASE_VERSION_NAME" ]; then
            BASE_VERSION_NAME="1.0.0"
          fi
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$BASE_VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Release APK (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./gradlew assembleRelease \
            -PciVersionCode=${{ steps.build_version.outputs.version_code }} \
            -PciVersionName=${{ steps.build_version.outputs.version_name }} \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Resolve release APK path
        id: release_apk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SIGNED_APK_PATH="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED_APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$SIGNED_APK_PATH" ]; then
            echo "Signed release APK not found at $SIGNED_APK_PATH"
            if [ -f "$UNSIGNED_APK_PATH" ]; then
              echo "Found unsigned APK at $UNSIGNED_APK_PATH. Release signing is not configured correctly."
            fi
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi

          echo "path=$SIGNED_APK_PATH" >> "$GITHUB_OUTPUT"


      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: app-release.apk
          path: ${{ steps.release_apk.outputs.path }}
          retention-days: 30

      - name: Prepare release changelog
        id: release_changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          COMMIT_TITLE="$(printf '%s\n' "$COMMIT_MESSAGE" | awk 'NF && $0 !~ /^Merge (pull request|branch)/ {print; exit}' | xargs)"

          if [ -z "$COMMIT_TITLE" ]; then
            COMMIT_TITLE="$(git log -n 20 --pretty=%s | awk 'NF && $0 !~ /^Merge (pull request|branch)/ {print; exit}' | xargs)"
          fi

          if [ -z "$COMMIT_TITLE" ]; then
            COMMIT_TITLE="Update"
          fi

          echo "value=$COMMIT_TITLE" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK to backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_UPLOAD_URL: ${{ secrets.RELEASE_UPLOAD_URL }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
          VERSION_CODE: ${{ steps.build_version.outputs.version_code }}
          VERSION_NAME: ${{ steps.build_version.outputs.version_name }}
          RELEASE_APK_PATH: ${{ steps.release_apk.outputs.path }}
          RELEASE_CHANGELOG: ${{ steps.release_changelog.outputs.value }}
        run: |
          curl --fail --show-error --location \
            -X POST "$RELEASE_UPLOAD_URL" \
            -H "X-CI-Upload-Token: $RELEASE_UPLOAD_TOKEN" \
            -F "platform=android" \
            -F "channel=stable" \
            -F "version_code=$VERSION_CODE" \
            -F "version_name=$VERSION_NAME" \
            -F "changelog=$RELEASE_CHANGELOG" \
            -F "apk=@$RELEASE_APK_PATH"

